                    data:
                      hvac_mode: cool
  - if:
      - condition: numeric_state
        entity_id: sensor.termometer_temperature
        below: 22
    then:
      - if:
          - condition: device
            device_id: cbf9b2aaa452a5504987971e20dc4546
            domain: device_tracker
            entity_id: a4100c464e17a9bdc3803945f00d4027
            type: is_home
        then:
          - choose:
              - conditions:
                  - condition: time
