                    before: "23:00:00"
                    weekday:
                      - mon
                      - tue
                      - wed
                      - thu
                      - fri
                      - sat
                      - sun
                sequence:
                  - action: climate.set_hvac_mode
                    target:
                      device_id: e4ff58754db9cef83b5c0c694317750e
                    data:
                      hvac_mode: heat
        else:
          - condition: device
            device_id: cbf9b2aaa452a5504987971e20dc4546
