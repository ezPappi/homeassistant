alias: Varmepumpe - oppvarming og kjøling
description: Combined heating and cooling control for heat pump
triggers:
  - type: changed_states
    device_id: e4ff58754db9cef83b5c0c694317750e
    entity_id: switch.varmepumpe
    domain: switch
    trigger: device
  - minutes: /1
    trigger: time_pattern
conditions: []
actions:
  - if:
      - condition: numeric_state
        entity_id: sensor.termometer_temperature
        above: 22
        below: 24
    then:
      - action: climate.turn_off
        target:
          device_id: e4ff58754db9cef83b5c0c694317750e
  - if:
      - condition: numeric_state
        entity_id: sensor.termometer_temperature
        above: 24
    then:
      - if:
          - condition: device
            device_id: cbf9b2aaa452a5504987971e20dc4546
            domain: device_tracker
            entity_id: a4100c464e17a9bdc3803945f00d4027
            type: is_home
        then:
          - choose:
              - conditions:
                  - condition: time
                    after: "05:00:00"
                    before: "23:00:00"
                    weekday:
                      - mon
                      - tue
                      - wed
                      - thu
                      - fri
                      - sat
                      - sun
                sequence:
                  - action: climate.set_hvac_mode
                    target:
                      device_id: e4ff58754db9cef83b5c0c694317750e
                    data:
                      hvac_mode: cool
        else:
          - condition: device
            device_id: cbf9b2aaa452a5504987971e20dc4546
            domain: device_tracker
            entity_id: a4100c464e17a9bdc3803945f00d4027
            type: is_not_home
          - choose:
              - conditions:
                  - condition: time
                    after: "05:00:00"
                    before: "07:00:00"
                    weekday:
                      - mon
                      - tue
                      - wed
                      - thu
                      - fri
                sequence:
                  - action: climate.set_hvac_mode
                    target:
                      device_id: e4ff58754db9cef83b5c0c694317750e
                    data:
                      hvac_mode: cool
              - conditions:
                  - condition: time
                    after: "14:00:00"
                    before: "22:00:00"
                    weekday:
                      - mon
                      - tue
                      - wed
                      - thu
                      - fri
                sequence:
                  - action: climate.set_hvac_mode
